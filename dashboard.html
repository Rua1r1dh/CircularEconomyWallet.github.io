<!DOCTYPE html>
<html>
<head>
<title>CEW Dashboard</title>
  <style>

body{
  font-family:Arial,sans-serif;

  color:white;
}

.card{
  background:#11251b;
  padding:30px;
  border-radius:12px;

  margin:50px auto;
}

button{
  width:100%;

  border-radius:8px;
}

<body>

<div class="card">

  <h1>Welcome to CEW</h1>

  <p>Points: 0</p>

  <p>Purchases Logged: 0</p>

  <button onclick="window.location.href='partners.html'">
    Browse Partners
  </button>

  <br><br>

  <button>
    Submit Purchase
  </button>

  <br><br>

  <button onclick="logout()">
    Log Out
  </button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(
  "https://jacbavguwlktbiocsfcz.supabase.co",
  "sb_publishable_4LYtkRuPl4VrnxXz67qRNg_Z8mfGXSN"
);

async function logout() {
  await client.auth.signOut();
  window.location.href = "login.html";
}
  async function checkUser() {

  const { data } = await client.auth.getUser();

  if (!data.user) {
    window.location.href = "login.html";
  }

}

checkUser();
  
</script>
