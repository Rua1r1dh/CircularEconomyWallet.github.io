<!DOCTYPE html>
<html>
<head>
<title>CEW Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#071a12;
  color:white;
  margin:0;
  padding:40px;
}

.dashboard{
  max-width:1000px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.header h1{
  margin:0;
  color:#E1BE73;
}

.logout{
  width:auto;
  padding:10px 18px;
  background:#E1BE73;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.metric-card{
  background:#11251b;
  padding:22px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
  border:1px solid rgba(225,190,115,0.15);
}

.metric-card h3{
  margin:0 0 10px 0;
  color:#BDB6A7;
  font-size:0.95rem;
}

.metric-card .number{
  font-size:2rem;
  font-weight:bold;
  color:#E1BE73;
}

.main-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.panel{
  background:#11251b;
  padding:25px;
  border-radius:14px;
  border:1px solid rgba(225,190,115,0.15);
}

.bar{
  margin-bottom:18px;
}

.bar-label{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  color:#BDB6A7;
}

.bar-track{
  background:#1a3526;
  height:14px;
  border-radius:20px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  background:#E1BE73;
  border-radius:20px;
}

button{
  width:100%;
  padding:12px;
  background:#E1BE73;
  border:none;
  cursor:pointer;
  font-weight:bold;
  border-radius:8px;
  margin-bottom:12px;
}

.secondary{
  background:#1a3526
