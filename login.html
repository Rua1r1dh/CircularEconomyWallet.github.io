<!DOCTYPE html>

<html>

<head>

<title>CEW - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body{
      font-family:Arial,sans-serif;
      background:#071a12;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

.card{
  background:#11251b;
  padding:30px;
  border-radius:12px;
  width:400px;
  margin:auto;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  background:#E1BE73;
  border:none;
  cursor:pointer;
  font-weight:bold;
  box-sizing:border-box;
  border-radius:8px;
}
#message{
  min-height:20px;
}
input,
button{
  border-radius:8px;
}

.card p{
  text-align:center;
}

.card a{
  color:#E1BE73;
}

h2{
  margin-bottom:25px;
  text-align:left;
}

  </style>
</head>
<body>

<div class="card">
  <h2>Log in</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Log in</button>

  <p id="message"></p>

  <p>
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </p>

  <p>
    <a href="#">Forgot Password?</a>
  </p>

</div>

<script>

const client = window.supabase.createClient(
  "https://jacbavguwlktbiocsfcz.supabase.co",
  "sb_publishable_4LYtkRuPl4VrnxXz67qRNg_Z8mfGXSN"
);

async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    document.getElementById("message").innerText =
      error.message;
    return;
  }

  window.location.href = "dashboard.html";
}

</script>

</body>
</html>
