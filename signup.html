<!DOCTYPE html>

<html>

<head>

<title>CEW - Sign Up</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body{
      font-family:Arial,sans-serif;
      background:#071a12;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

 .card{
  background:#11251b;
  padding:30px;
  border-radius:12px;
  width:400px;
  margin:auto;
}
    button{
  width:100%;
  padding:12px;
  background:#E1BE73;
  border:none;
  cursor:pointer;
  font-weight:bold;
  box-sizing:border-box;
}
    .card p{
  text-align:center;
}

    h2{
  margin-bottom:25px;
}

   input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  box-sizing:border-box;
}
    input,
button{
  border-radius:8px;
}
    .card a{
  color:#E1BE73;
}

    button{
      width:100%;
      padding:12px;
      background:#E1BE73;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Create Account</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Create Account</button>

  <p id="message"></p>
    <p>
Already have an account?
<a href="login.html">Login</a>
</p>
    
</div>

<script>

const client = window.supabase.createClient(
  "https://jacbavguwlktbiocsfcz.supabase.co",
  "sb_publishable_4LYtkRuPl4VrnxXz67qRNg_Z8mfGXSN"
);

async function signup() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  console.log("Testing signup");

  const { data, error } = await client.auth.signUp({
    email: email,
    password: password
  });

  console.log(data);
  console.log(error);

  if (error) {
    document.getElementById("message").innerText =
      error.message;
    return;
  }

alert("Account created. Check your email.");

window.location.href = "login.html";
}

</script>

</body>
</html>
